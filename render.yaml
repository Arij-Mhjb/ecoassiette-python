# Blueprint Render (alternative à la configuration manuelle du guide)
databases:
  - name: ecoassiette-db
    plan: free
    databaseName: ecoassiette
    user: ecoassiette

services:
  - type: web
    name: ecoassiette
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "python -m gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecoassiette-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: DEBUG
        value: "False"
      - key: GEMINI_API_KEY
        sync: false
      - key: CONFIRMATION_EMAIL     # False : pas de service e-mail sur Render gratuit
        value: "False"
      - key: BREVO_API_KEY          # e-mails (Render gratuit bloque l'SMTP)
        sync: false
      - key: DEFAULT_FROM_EMAIL     # ex. "EcoAssiette <adresse.verifiee@gmail.com>"
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: SEED_DEMO
        value: "True"
