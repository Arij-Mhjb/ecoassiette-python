{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}
<div class="narrow card">
  <h1>Connexion</h1>
  <form method="post">
    {% csrf_token %}
    {% include "includes/form.html" %}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn btn-block">Se connecter</button>
  </form>
  <p class="center small"><a href="{% url 'users:password_reset' %}">Mot de passe oublié ?</a></p>
  <p class="center small">Pas encore de compte ? <a href="{% url 'users:inscription' %}">Créer un compte</a></p>
</div>
{% endblock %}
